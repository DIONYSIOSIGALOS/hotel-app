*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body.light{--bg:#f3f5f7;--card:#fff;--card2:#eef1f4;--text:#18202a;--muted:#65707d;--line:#d7dde4}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px}
.head{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:1.5px}.who{font-size:12px;color:var(--muted)}
.wrap{max-width:1200px;margin:auto;padding:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
h1,h2,h3{margin:0 0 12px}.muted{color:var(--muted)}.hidden{display:none!important}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:14px 18px;border-radius:14px;font-weight:800;white-space:nowrap}.tab.active{background:var(--accent);color:#111;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.pill{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--text);font-weight:800;text-align:left}.pill.active{outline:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card2))}
label{display:block;font-weight:800;margin:14px 0 7px}.input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:900;background:var(--accent);color:#111}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:#fff}.btn.ok{background:var(--ok);color:#fff}

</div></header>

  </div>

      <div class="notice">Χρήστης: <b id="reporterName"></b>. Η ταυτότητα καταγράφεται αυτόματα.</div>
      <label>1. Περιοχή / Τοποθεσία</label>
      <div id="areas" class="grid"></div>
      <label>Συγκεκριμένο σημείο</label>
      <select id="locationSelect" class="input"></select>

      <label>2. Ειδικότητα</label>
      <div id="cats" class="grid"></div>
      <div id="sop" class="sop hidden"></div>
      <label>3. Συχνή βλάβη (προαιρετικά)</label>
      <div id="issues" class="grid"></div>
      <label>4. 📝 Περιγραφή Βλάβης / Σημειώσεις</label>
      <textarea id="note" rows="5" placeholder="Γράψε ελεύθερα ό,τι ακριβώς παρατηρείς..."></textarea>
      <label>5. Φωτογραφίες (έως 4)</label>
      <input id="photos" class="input" type="file" accept="image/*" capture="environment" multiple>

      <div id="preview" class="photo-grid"></div>
      <div class="actions"><button class="btn" onclick="submitTicket()">🚀 Καταχώρηση Βλάβης</button><button class="btn secondary" onclick="resetForm()">Καθαρισμός</button></div>
      <p id="submitMsg" class="small"></p>
    </div>
  </section>

  <section id="dash" class="hidden">
    <div class="panel"><h2>Ταμπλό</h2><p class="muted">Ανοιχτές και σε εξέλιξη βλάβες δεν διαγράφονται. Οι ολοκληρωμένες κρύβονται μετά από 48 ώρες.</p>
      <div id="dashboard" class="ticket-grid"></div>
    </div>
  </section>

  <section id="analytics" class="hidden">
    <div class="panel"><h2>Analytics</h2><div id="stats" class="statgrid"></div><div id="analyticsDetails"></div></div>
  </section>
</main>

function esc(s){
  return String(s??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );
}

function isAdmin(){
  return currentUser?.role==='admin';
}

function isHousing(){
  return currentUser?.role==='housing';
}

function canSeeLocation(loc){
  if(isAdmin()) return true;

  if(isHousing())
    return /^5(0[1-9]|[1-3][0-9]|40)$/.test(loc)
      || /^((701|702|703|704|705|706|707|708|709|71[0-9]|72[0-9]|73[0-9]|740|80[1-9]|8[1-3][0-9]|840|100[1-9]|10[1-3][0-9]|1040|110[1-9]|11[0-5][0-9]|1160))$/.test(loc)
      || loc.includes('ΚΔΠ')
      || loc.includes('Προσωπικού')
      || loc.includes('Breco')
      || loc.includes('Τένις');

  if(currentUser?.department){
    const r=currentUser.role;

    if(r==='style'||r==='curators')
      return !engineeringOnly.includes(loc)
        && !/^((70[1-9]|7[1-3][0-9]|740|80[1-9]|8[1-3][0-9]|840|100[1-9]|10[1-3][0-9]|1040|110[1-9]|11[0-5][0-9]|1160))$/.test(loc);

    if(r==='reception')
      return !engineeringOnly.includes(loc)
        && !loc.includes('Workshop');

    if(r==='fb')
      return /Restaurant|Bar|Kitchen|Platea|Parelia|Wet Deck|Staff Canteen|500|Welcome Desk/i.test(loc);

    if(r==='spa')
      return /Spa|FIT|Gym|Treatment|Sauna/i.test(loc);

    if(r==='security')
      return /Parking|Πάρκινγκ|Ράμπα|Welcome|Lounge|Platea|Parelia|Wet Deck|Gate|Φωτισ/i.test(loc);
  }

  return true;
}

function allLocations(){
  let arr=[];

  for(const [area,subs] of Object.entries(resort))
    for(const [sub,items] of Object.entries(subs))
      for(const x of items)
        arr.push({area,sub,name:x});

  for(const [area,o] of Object.entries(housing))
    for(const x of [...o.rooms,...o.extras])
      arr.push({area,sub:'Housing',name:x});

  for(const x of engineeringOnly)
    arr.push({
      area:'Engineering Only',
      sub:'Infrastructure',
      name:x
    });

  return arr.filter(x=>canSeeLocation(x.name));
}

function renderAreas(){
  const unique=[
    ...new Set(allLocations().map(x=>x.area))

  areas.innerHTML=unique.map(a=>
    `<button class="pill ${selectedArea===a?'active':''}"
      onclick="selectArea('${esc(a).replace(/'/g,"\\'")}')">
      ${esc(a)}
    </button>`
  ).join('');

  if(!selectedArea||!unique.includes(selectedArea))
    selectedArea=unique[0]||'';

  renderLocations();
}

function selectArea(a){
  selectedArea=a;

}

    `<button class="pill ${selectedCategory===c?'active':''}"
      onclick="selectCat('${esc(c).replace(/'/g,"\\'")}')">
      ${esc(c)}
    </button>`
  ).join('');

}

function selectCat(c){
  selectedCategory=c;
  selectedIssue='';
  renderCats();
  renderIssues();
  renderSop();
}

function renderIssues(){
  issues.innerHTML=(presets[selectedCategory]||[])
    .map(i=>
      `<button class="pill ${selectedIssue===i?'active':''}"
        onclick="selectedIssue='${esc(i).replace(/'/g,"\\'")}';renderIssues()">
        ${esc(i)}
      </button>`
    ).join('');
}

function renderSop(){
  const on=/Safe|Lock|Χρηματοκιβώτιο|κλειδαριά/i
    .test(selectedCategory+' '+selectedIssue);

  sop.classList.toggle('hidden',!on);

  sop.innerHTML=on
    ? '⚠️ <b>ΥΠΟΧΡΕΩΤΙΚΟ SECURITY SOP</b><br>Η επέμβαση σε χρηματοκιβώτιο ή ξεκλείδωμα πόρτας απαιτεί φυσική παρουσία μέλους της Security.'
    : '';
}

photos.addEventListener('change',async e=>{
  photoData=[];
  preview.innerHTML='';

  for(const f of [...e.target.files].slice(0,4)){
    const d=await compress(f);
    photoData.push(d);
    preview.innerHTML+=`<img src="${d}">`;
  }
});

function compress(file){
  return new Promise(res=>{
    const im=new Image(),
          r=new FileReader();

    r.onload=()=>{
      im.onload=()=>{
        let w=im.width,
            h=im.height,
            m=Math.max(w,h);

        if(m>1000){
          w=Math.round(w*1000/m);
          h=Math.round(h*1000/m);
        }

        const c=document.createElement('canvas');
        c.width=w;
        c.height=h;

        c.getContext('2d').drawImage(im,0,0,w,h);

        res(c.toDataURL('image/jpeg',.75));
      };

      im.src=r.result;
    };

    r.readAsDataURL(file);
  });
}

async function login(){
  const pin=document.getElementById('pin').value.trim();
  const u=USERS_ALL[pin];

  if(!u){
    loginErr.textContent='Μη έγκυρο PIN.';
    return;
  }

  currentUser={
    pin,
    ...u
  };

  sessionStorage.setItem(
    'wm_user',
    JSON.stringify(currentUser)
  );

  if(remember.checked)
    localStorage.setItem(
      'wm_user',
      JSON.stringify(currentUser)
    );
  else
    localStorage.removeItem('wm_user');

  enterApp();
}

function enterApp(){
  login.classList.add('hidden');
  app.classList.remove('hidden');

  who.textContent=
    `${currentUser.name} • ${currentUser.spec}`;

  reporterName.textContent=
    currentUser.name;

  tabAnalytics.classList.toggle(
    'hidden',
    !isAdmin()
  );

  renderAreas();
  renderCats();
  loadTickets();
}

function logout(){
  localStorage.removeItem('wm_user');
  sessionStorage.removeItem('wm_user');
  location.reload();
}

function boot(){
  try{
    currentUser=JSON.parse(
      localStorage.getItem('wm_user')||
      sessionStorage.getItem('wm_user')||
      'null'
    );
  }catch{}

  if(currentUser)
    enterApp();
}

function showTab(t){
  for(const x of ['report','dash','analytics'])
    document.getElementById(x)
      .classList.toggle('hidden',x!==t);

  tabReport.classList.toggle(
    'active',
    t==='report'
  );

  tabDash.classList.toggle(
    'active',
    t==='dash'
  );

  tabAnalytics.classList.toggle(
    'active',
    t==='analytics'
  );

  if(t==='dash')
    loadTickets();

  if(t==='analytics')
    loadAnalytics();
}

function resetForm(){
  selectedArea='';
  selectedLocation='';
  selectedCategory='';
  selectedIssue='';
  note.value='';
  customLocation.value='';
  photos.value='';
  photoData=[];
  preview.innerHTML='';
  renderAreas();
  renderCats();
  renderIssues();
  renderSop();
  submitMsg.textContent='';
}

async function submitTicket(){
  const loc=
    customLocation.value.trim()||
    locationSelect.value;

  if(
    !loc||
    !selectedCategory||
    (!selectedIssue&&!note.value.trim())
  ){
    submitMsg.textContent=
      'Συμπλήρωσε τοποθεσία, ειδικότητα και βλάβη/περιγραφή.';
    return;
  }

  const sopOn=
    /Safe|Lock|Χρηματοκιβώτιο|κλειδαριά/i
      .test(selectedCategory+' '+selectedIssue);

  const issue=[
    selectedIssue,
    note.value.trim()
  ].filter(Boolean).join(' — ');

  const payload={
    location_type:selectedArea||'Άλλη Περιοχή',
    location_name:loc,
    category:selectedCategory,
    issue,
    photo_url:JSON.stringify(photoData),
    status:'pending',
    priority:sopOn?'Urgent (SOP)':'Normal',
    reported_by:currentUser.name
  };

  const {error}=await db
    .from('tickets')
    .insert([payload]);

  if(error){
    submitMsg.textContent=
      'Σφάλμα: '+error.message;
    return;
  }

  submitMsg.textContent=
    '✓ Η βλάβη καταχωρήθηκε.';

  resetForm();
  playAlarm();
  loadTickets();
}

function roleCanTake(t){
  if(isAdmin())
    return true;

  if(currentUser.department)
    return false;

  const map={
    electrician:'Ηλεκτρολογικά',
    plumber:'Υδραυλικά',
    av:'A/V',
    ac:'A/C',
    carpenter:'Ξυλουργικά',
    pool:'Πισίνες',
    civil:'Civil'
  };

  return map[currentUser.role]===t.category;
}

function relative(d){
  const m=
    Math.floor(
      (Date.now()-new Date(d))/60000
    );

  if(m<1) return 'τώρα';
  if(m<60) return `${m}′`;

  return `${Math.floor(m/60)}h`;
}

function photosHtml(s){
  try{
    const a=JSON.parse(s||'[]');

    return Array.isArray(a)&&a.length
      ? `<div class="photo-grid">
          ${a.map(x=>
            `<img src="${x}"
              onclick="window.open(this.src)">`
          ).join('')}
        </div>`
      : '';
  }catch{
    return s
      ? `<div class="photo-grid">
          <img src="${s}">
        </div>`
      : '';
  }
}

async function loadTickets(){
  const {data,error}=await db
    .from('tickets')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    dashboard.innerHTML=
      `<p>${esc(error.message)}</p>`;
    return;
  }

  const cutoff=
    Date.now()-48*3600000;

  let rows=(data||[]).filter(
    t=>
      t.status!=='completed'||
      new Date(
        t.updated_at||t.created_at
      ).getTime()>cutoff
  );

  if(!isAdmin()&&!currentUser.department){
    const map={
      electrician:'Ηλεκτρολογικά',
      plumber:'Υδραυλικά',
      av:'A/V',
      ac:'A/C',
      carpenter:'Ξυλουργικά',
      pool:'Πισίνες',
      civil:'Civil'
    };

    if(map[currentUser.role])
      rows=rows.filter(
        t=>t.category===map[currentUser.role]
      );
  }

  if(currentUser.department)
    rows=rows.filter(
      t=>canSeeLocation(t.location_name)
    );

  dashboard.innerHTML=
    rows.length
      ? rows.map(card).join('')
      : '<p class="muted">Δεν υπάρχουν ενεργές βλάβες.</p>';
}

function card(t){
  const cls=
    t.status==='completed'
      ? 'done'
      : t.status==='in_progress'
        ? 'progress'
        : 'open';

  let buttons='';

  if(
    t.status==='pending' &&
    roleCanTake(t)
  )
    buttons+=
      `<button class="btn"
        onclick="takeTicket('${t.id}')">
        Ανάληψη
      </button>`;

  if(
    t.status==='in_progress' &&
    t.assigned_role===currentUser.name
  )
    buttons+=
      `<button class="btn ok"
        onclick="completeTicket('${t.id}')">
        ✓ Ολοκλήρωση
      </button>`;

  if(
    (isAdmin()||
      t.assigned_role===currentUser.name) &&
    t.status!=='completed'
  )
    buttons+=
      `<button class="btn secondary"
        onclick="addCollaborator('${t.id}')">
        + Συνεργάτης
      </button>
      <button class="btn secondary"
        onclick="winter('${t.id}',${!String(t.priority||'').includes('WINTER')})">
        ❄️ Χειμερινό
      </button>`;

  return `
    <article class="ticket ${cls}">
      <h3>${esc(t.location_name)}</h3>

      <span class="badge">
        ${esc(t.category)}
      </span>

      <span class="badge">
        ${esc(t.status)}
      </span>

      <span class="badge">
        ${esc(t.priority||'Normal')}
      </span>

      <p>${esc(t.issue)}</p>

      <p class="small muted">
        Δήλωσε: ${esc(t.reported_by||'—')}
        • Ανάληψη: ${esc(t.assigned_role||'—')}
        • ${relative(t.created_at)}
      </p>

      ${photosHtml(t.photo_url)}

      <div class="actions">
        ${buttons}
      </div>
    </article>
  `;
}

async function takeTicket(id){
  const {error}=await db
    .from('tickets')
    .update({
      status:'in_progress',
      assigned_role:currentUser.name
    })
    .eq('id',id);

  if(error)
    alert(error.message);

  loadTickets();
}

async function completeTicket(id){
  const {error}=await db
    .from('tickets')
    .update({
      status:'completed'
    })
    .eq('id',id);

  if(error)
    alert(error.message);

  loadTickets();
  playAlarm();
}

async function addCollaborator(id){
  const n=prompt(
    'Ονοματεπώνυμο συνεργάτη / ειδικότητα:'
  );

  if(!n)
    return;

  const {data}=await db
    .from('tickets')
    .select('issue')
    .eq('id',id)
    .single();

  const issue=
    (data?.issue||'')+
    ` | Συνεργάτης: ${n}`;

  await db
    .from('tickets')
    .update({issue})
    .eq('id',id);

  loadTickets();
}

async function winter(id,on){
  const {data}=await db
    .from('tickets')
    .select('priority')
    .eq('id',id)
    .single();

  let p=data?.priority||'Normal';

  p=p.replace(' • WINTER','');

  if(on)
    p+=' • WINTER';

  await db
    .from('tickets')
    .update({priority:p})
    .eq('id',id);

  loadTickets();
}

async function loadAnalytics(){
  if(!isAdmin())
    return;

  const {data,error}=await db
    .from('tickets')
    .select('*');

  if(error){
    stats.innerHTML=
      esc(error.message);
    return;
  }

  const rows=data||[];

  const active=
    rows.filter(
      x=>x.status!=='completed'
    );

  const done=
    rows.filter(
      x=>x.status==='completed'
    );

  const byCat={};
  const byUser={};
  const byStatus={
    pending:0,
    in_progress:0,
    completed:0
  };

  rows.forEach(t=>{
    byCat[t.category]=
      (byCat[t.category]||0)+1;

    byUser[t.reported_by||'—']=
      (byUser[t.reported_by||'—']||0)+1;

    byStatus[t.status]=
      (byStatus[t.status]||0)+1;
  });

  stats.innerHTML=`
    <div class="stat">
      <span>Σύνολο</span>
      <b>${rows.length}</b>
    </div>

    <div class="stat">
      <span>Ανοιχτά</span>
      <b>${active.length}</b>
    </div>

    <div class="stat">
      <span>Ολοκληρωμένα</span>
      <b>${done.length}</b>
    </div>

    <div class="stat">
      <span>Επείγοντα SOP</span>
      <b>
        ${rows.filter(
          x=>String(x.priority)
            .includes('Urgent')
        ).length}
      </b>
    </div>
  `;

  analyticsDetails.innerHTML=
    '<h3>Ανά ειδικότητα</h3>'+
    Object.entries(byCat)
      .map(
        ([k,v])=>
          `<span class="badge">
            ${esc(k)}: ${v}
          </span>`
      )
      .join('')+

    '<h3 style="margin-top:18px">Αναφορές ανά τμήμα / χρήστη</h3>'+
    Object.entries(byUser)
      .sort((a,b)=>b[1]-a[1])
      .map(
        ([k,v])=>
          `<div>
            ${esc(k)} — <b>${v}</b>
          </div>`
      )
      .join('');
}

function toggleTheme(){
  document.body.classList.toggle('light');

  localStorage.setItem(
    'wm_theme',
    document.body.classList.contains('light')
      ? 'light'
      : 'dark'
  );
}

function toggleLang(){
  alert(
    'Η πλήρης μετάφραση EL/EN παραμένει ενεργή στο τελικό UI· τα labels της έκδοσης αυτής είναι προετοιμασμένα για i18n.'
  );
}

function playAlarm(){
  try{
    navigator.vibrate?.([120,80,120]);

    const a=new AudioContext(),
          o=a.createOscillator(),
          g=a.createGain();

    o.frequency.value=740;
    g.gain.value=.05;

    o.connect(g);
    g.connect(a.destination);

    o.start();
    o.stop(a.currentTime+.18);
  }catch{}
}

db.channel('tickets-realtime')
  .on(
    'postgres_changes',
    {
      event:'*',
      schema:'public',
      table:'tickets'
    },
    ()=>{
      loadTickets();

      if(isAdmin())
        loadAnalytics();
    }
  )
  .subscribe();

document.getElementById('pin')
  .addEventListener(
    'keydown',
    e=>{
      if(e.key==='Enter')
        login();
    }
  );

if(
  localStorage.getItem('wm_theme')==='light'
)
  document.body.classList.add('light');

boot();
</script>
